<!DOCTYPE html><html><head><meta charset="UTF-8"><title>plate renderer</title></head><body>
<!-- Renders one board to SVG for tools/plates/build.py. Open as file://…/render.html?k=<guide-path>; the SVG markup lands in #out. -->
<svg id="s" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320"></svg><pre id="out"></pre>
<script src="vendor/rough.js"></script><script src="boards.js"></script>
<script>
var k=new URLSearchParams(location.search).get('k'),svg=document.getElementById('s');
if(!BOARD.draw(svg,k)){document.getElementById('out').textContent='<<<NONE>>>';}
else{
  svg.querySelectorAll('path').forEach(function(p){p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');});
  svg.querySelectorAll('text').forEach(function(t){var cls=t.getAttribute('class')||'';t.setAttribute('style','fill:'+(cls.indexOf('note')>=0?'var(--text-muted)':'var(--text)'));t.removeAttribute('class');});
  svg.removeAttribute('id');svg.setAttribute('role','img');
  document.getElementById('out').textContent='<<<SVG>>>'+svg.outerHTML+'<<<END>>>';
}
</script></body></html>
